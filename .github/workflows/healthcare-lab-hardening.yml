name: Healthcare Lab Hardening
on:
  push:
    branches: ["claude/healthcare-research-innovation-lab-l6edy0"]
  pull_request:
    branches: ["main"]

jobs:
  runtime-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run hardening invariants
        run: python healthcare-lab/runtime/tests/run_tests.py
